name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  quality:
    name: Check code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run format:changed "$BASE_SHA"
      - name: Detect workspace changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for workspace in mobile website; do
            changed_files=$(git diff --name-only --no-renames "$BASE_SHA...HEAD" -- \
              "apps/$workspace/" package.json bun.lock bunfig.toml .node-version \
              .github/workflows/checks.yml)
            if [[ -n "$changed_files" ]]; then
              echo "$workspace=true" >> "$GITHUB_OUTPUT"
            else
              echo "$workspace=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Lint mobile
        if: steps.changes.outputs.mobile == 'true'
        run: bun --filter '@tackbok/mobile' lint
      - name: Lint website
        if: steps.changes.outputs.website == 'true'
        run: bun --filter '@tackbok/website' lint
      - name: Typecheck mobile
        if: steps.changes.outputs.mobile == 'true'
        run: bun --filter '@tackbok/mobile' typecheck
      - name: Typecheck website
        if: steps.changes.outputs.website == 'true'
        run: bun --filter '@tackbok/website' typecheck
      - name: Test mobile
        if: steps.changes.outputs.mobile == 'true'
        run: bun --filter '@tackbok/mobile' test
      - name: Test website if configured
        if: steps.changes.outputs.website == 'true'
        run: bun --filter '@tackbok/website' --if-present test
      - name: Build website
        if: steps.changes.outputs.website == 'true'
        run: bun run build
