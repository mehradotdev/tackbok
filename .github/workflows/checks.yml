name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run format:changed "$BASE_SHA"
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Detect website build changes
        id: website
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files=$(git diff --name-only --no-renames "$BASE_SHA...HEAD" -- \
            apps/website/ package.json bun.lock bunfig.toml .node-version \
            .github/workflows/checks.yml)
          if [[ -n "$changed_files" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build website
        if: steps.website.outputs.build == 'true'
        run: bun run build
