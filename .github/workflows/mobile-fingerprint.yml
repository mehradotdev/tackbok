name: Mobile fingerprint

# Flags PRs that change the native fingerprint. Those changes cannot ship as an
# OTA update: they need a version bump (runtimeVersion uses the appVersion
# policy) and a new store build, or older binaries could receive incompatible JS.
# Advisory only: the job passes either way and the "native change" label is the
# signal. Adapted from pingdotgg/t3code's mobile-fingerprint-check.yml.
on:
  pull_request:
    # `edited` covers base-branch changes, so a stale label can be cleared.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: mobile-fingerprint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  APP_VARIANT: production
  LABEL: native change

jobs:
  fingerprint:
    name: Native fingerprint diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # Pin the merge commit and compare against its first parent.
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Detect native fingerprint inputs
        id: changes
        run: |
          base_sha=$(git rev-parse HEAD^1)
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          changed_files=$(git diff --name-only --no-renames "$base_sha" HEAD -- \
            apps/mobile/ ':!apps/mobile/src/' ':!apps/mobile/docs/' \
            ':!apps/mobile/__mocks__/' ':!apps/mobile/**/*.md' \
            package.json bun.lock bunfig.toml patches/ \
            .github/workflows/mobile-fingerprint.yml)
          if [[ -n "$changed_files" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No native fingerprint inputs changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.relevant == 'true'
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Fingerprint merge result
        if: steps.changes.outputs.relevant == 'true'
        run: |
          bun install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/fp/head"
          cd apps/mobile
          for platform in ios android; do
            bunx expo-updates fingerprint:generate --platform "$platform" \
              > "$RUNNER_TEMP/fp/head/$platform.json"
          done
      - name: Fingerprint base
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          git checkout --quiet "$BASE_SHA"
          # Reinstall from the base lockfile so dependency changes are compared.
          bun install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/fp/base"
          cd apps/mobile
          for platform in ios android; do
            bunx expo-updates fingerprint:generate --platform "$platform" \
              > "$RUNNER_TEMP/fp/base/$platform.json"
          done
      - name: Compare fingerprints
        id: compare
        if: steps.changes.outputs.relevant == 'true'
        run: |
          changed=""
          {
            echo "## Native fingerprint diff"
            echo
            for platform in ios android; do
              head_hash=$(jq -r .hash "$RUNNER_TEMP/fp/head/$platform.json")
              base_hash=$(jq -r .hash "$RUNNER_TEMP/fp/base/$platform.json")
              if [[ "$head_hash" == "$base_hash" ]]; then
                echo "- **$platform**: unchanged, OTA-compatible"
                continue
              fi
              changed="$changed $platform"
              echo "- **$platform**: changed. Bump the app version and ship a store build; do not publish this as an OTA update to existing builds."
              jq -r -n \
                --slurpfile h "$RUNNER_TEMP/fp/head/$platform.json" \
                --slurpfile b "$RUNNER_TEMP/fp/base/$platform.json" '
                  ($b[0].sources | map({ (.filePath // .id): .hash }) | add // {}) as $bm
                  | $h[0].sources[]
                  | select($bm[(.filePath // .id)] != .hash)
                  | "  - \(.type): `\(.filePath // .id)`"'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed_platforms=${changed# }" >> "$GITHUB_OUTPUT"
      - name: Sync label
        # Fork PRs get a read-only token; the job summary still shows the result.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.compare.outputs.changed_platforms }}
        run: |
          if [[ -n "$CHANGED" ]]; then
            gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color D93F0B \
              --description 'Changes the native fingerprint; needs a store build, not OTA' \
              --force
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "$LABEL"
            echo "::warning::Native fingerprint changed ($CHANGED). This PR cannot ship as an OTA update."
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL" || true
          fi
